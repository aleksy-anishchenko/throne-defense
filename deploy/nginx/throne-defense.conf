# Сайт throne-defense.ru.
# На сервере: /etc/nginx/sites-available/throne-defense (+ ссылка в sites-enabled).
#
# ⚠️ Это версия ДО certbot. Certbot сам допишет на сервере блоки HTTPS (listen 443 ssl,
# пути к сертификату) и перенаправление http → https. После этого настоящий конфиг —
# тот, что на сервере; эту копию нужно обновить по нему (nginx -T или cat на сервере).

# Основной сайт. Первым в файле: на запросы по голому IP nginx отвечает первым блоком
server {
    listen 80;
    listen [::]:80;
    server_name throne-defense.ru;

    root /var/www/throne-defense;
    index index.html;
    server_tokens off;

    # Сжатие. По умолчанию nginx сжимает только HTML, а JS и CSS отдаёт как есть
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    include snippets/throne-security.conf;

    # Файлы сборки: в имени есть хеш, поэтому их можно хранить в браузере год
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/throne-security.conf;
        try_files $uri =404;
    }

    # А саму страницу браузер каждый раз перепроверяет — иначе не увидит новую версию
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/throne-security.conf;
    }

    # Игра одностраничная, роутера нет: чего нет на диске — того нет (404)
    location / {
        try_files $uri $uri/ =404;
    }

    # Запросы /api/... уходят в Node. Пока бэкенда нет, отвечают ошибкой 502 — это нормально
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www.throne-defense.ru → throne-defense.ru. Адрес у игры один: рекорды в браузере
# хранятся отдельно для каждого адреса
server {
    listen 80;
    listen [::]:80;
    server_name www.throne-defense.ru;
    server_tokens off;
    return 301 https://throne-defense.ru$request_uri;
}
