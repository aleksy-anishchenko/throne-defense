# Сайт throne-defense.ru.
# На сервере: /etc/nginx/sites-available/throne-defense (+ ссылка в sites-enabled).
# Это и есть настоящий конфиг: правим здесь, копируем на сервер (scp), там nginx -t и reload.
#
# Сертификат Let's Encrypt (оба адреса) получен certbot'ом и продлевается сам.
# Строки с /etc/letsencrypt/ — от certbot, не трогать.
# HTTP/2 на nginx 1.24 (Ubuntu 24.04) включается словом http2 в listen; с 1.25.1 — отдельной строкой http2 on;

# Основной сайт: https://throne-defense.ru
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name throne-defense.ru;

    ssl_certificate /etc/letsencrypt/live/throne-defense.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/throne-defense.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/throne-defense;
    index index.html;
    server_tokens off;

    # Сжатие. По умолчанию nginx сжимает только HTML, а JS и CSS отдаёт как есть
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    include snippets/throne-security.conf;

    # Файлы сборки: в имени есть хеш, поэтому их можно хранить в браузере год
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/throne-security.conf;
        try_files $uri =404;
    }

    # А саму страницу браузер каждый раз перепроверяет — иначе не увидит новую версию
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/throne-security.conf;
    }

    # Игра одностраничная, роутера нет: чего нет на диске — того нет (404)
    location / {
        try_files $uri $uri/ =404;
    }

    # Запросы /api/... уходят в Node. Пока бэкенда нет, отвечают ошибкой 502 — это нормально
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# https://www.throne-defense.ru → https://throne-defense.ru.
# Адрес у игры один: рекорды в браузере хранятся отдельно для каждого адреса
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.throne-defense.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/throne-defense.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/throne-defense.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://throne-defense.ru$request_uri;
}

# Любой http:// (с www и без) → сразу https://throne-defense.ru, одним перенаправлением.
# Certbot при продлении сам временно добавляет сюда проверку домена — этот блок ему не мешает
server {
    listen 80;
    listen [::]:80;
    server_name throne-defense.ru www.throne-defense.ru;
    server_tokens off;

    return 301 https://throne-defense.ru$request_uri;
}
