# Заголовки безопасности для throne-defense.ru.
# На сервере: /etc/nginx/snippets/throne-security.conf
#
# Отдельным файлом не случайно: add_header внутри location ОТМЕНЯЕТ все add_header уровнем выше,
# поэтому там, где у location есть свой add_header, этот файл подключается ещё раз.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Запрет открывать игру во фрейме на чужом сайте.
# Если площадкой станет VK или Telegram (этап 4) — убрать или заменить
add_header X-Frame-Options "SAMEORIGIN" always;
