<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1f30">
<title>Защита трона</title>
<meta name="description" content="Мятежники ломятся в тронный зал. Расставьте стражу вдоль ковра и не подпустите их к трону.">
<meta property="og:title" content="Защита трона">
<meta property="og:description" content="Сколько волн выдержит ваш трон?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a8212f'/%3E%3Cpath d='M6 23 4 10l7 5 5-9 5 9 7-5-2 13z' fill='%23e3b24a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=Ruslan+Display&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#1c1f30;
  --slab:#2a2e45;
  --slab-hi:#363b58;
  --edge:#474d70;
  --parch:#f3e9d2;
  --parch-dim:#b7af9d;
  --gold:#e3b24a;
  --crimson:#a8212f;
  --crimson-deep:#7a1421;
  --ember:#f0863a;
  --display:'Ruslan Display',Georgia,serif;
  --ui:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--wall);color:var(--parch);
  font-family:var(--ui);font-weight:500;font-size:16px;
  overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

#app{
  height:100vh;height:100dvh;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* Верхняя строка */
.hud{display:flex;align-items:center;gap:16px;padding:8px 12px 6px}
.brand{display:none;font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--gold);text-shadow:0 2px 0 var(--crimson-deep);margin-right:8px}
.stat{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px;flex:none}
.stat.low{color:var(--ember)}
.stat.bump{animation:bump .35s}
@keyframes bump{30%{transform:scale(1.25);color:var(--ember)}}
.wave{margin-left:auto;font-weight:700;font-size:1.05rem}

/* Поле */
.stage{position:relative;min-height:0;overflow:hidden}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none;border-radius:5px;box-shadow:0 0 0 2px var(--edge),0 10px 30px rgba(8,9,18,.6);cursor:pointer}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:92%;padding:7px 14px;background:#10121f;border:1px solid var(--edge);border-radius:6px;font-weight:700;opacity:0;transition:opacity .15s;pointer-events:none;text-align:center}
.toast.on{opacity:1}

/* Панель */
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:4px 10px 10px}
#hint{grid-row:1;margin:0;height:1.3em;font-size:.95rem;line-height:1.3;color:var(--parch-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop,.towerbox{grid-row:2;height:84px}
.controls{grid-row:3}
.panel.tw .shop{display:none}

.towerbox{display:flex;align-items:stretch;gap:6px}
.towerbox .who{flex:1 1 auto;min-width:0;align-self:center;line-height:1.25}
.towerbox .who b{display:block;font-weight:800;font-size:1.12rem}
.towerbox .who span{display:block;font-size:.9rem;color:var(--parch-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.shop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 4px 5px;background:var(--slab);border:2px solid var(--edge);border-radius:6px;cursor:pointer;text-align:center;min-width:0}
.card canvas{width:36px;height:36px;display:block}
.card .nm{font-weight:800;font-size:.92rem;line-height:1.1}
.card .cost{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.9rem;color:var(--gold);font-variant-numeric:tabular-nums}
.card .cost svg{width:13px;height:13px}
.card .ds{display:none}
.card .ds::first-letter{text-transform:uppercase}
.card[aria-pressed="true"]{border-color:var(--gold);background:var(--slab-hi)}
.card.poor .cost{color:var(--parch-dim)}
.card.poor canvas{opacity:.5}

.controls{display:flex;gap:6px}
.btn{min-height:46px;padding:0 14px;background:var(--slab);border:2px solid var(--edge);border-radius:6px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--crimson);border-color:var(--gold);color:#fff3d6}
.btn.grow{flex:1 1 auto}
.btn.icon{flex:none;width:48px;padding:0;display:grid;place-items:center}
.btn.icon svg{width:22px;height:22px}
.btn.act{flex:none;min-width:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 10px;line-height:1.1}
.btn.act .pr{font-weight:700;font-size:.92rem;color:var(--gold);font-variant-numeric:tabular-nums}
.btn.act.primary .pr{color:#ffe7a8}
.keys{display:none}

/* Заставка и итоги */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:rgba(16,17,28,.78);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,430px);display:grid;gap:16px;justify-items:center;text-align:center}
.sheet h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2.7rem,12vw,4.4rem);line-height:1.02;color:var(--gold);text-shadow:0 .07em 0 var(--crimson-deep);text-wrap:balance}
.sheet p{margin:0;font-size:1.12rem;line-height:1.4;max-width:34ch}
.sheet .dim{color:var(--parch-dim);font-size:1rem}
.sheet .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.sheet .btn{min-height:50px;padding:0 20px;font-size:1.05rem}
.sheet .btn.primary{min-width:190px;font-size:1.15rem}

/* Широкий экран: панель справа */
@media (min-width:860px) and (min-aspect-ratio:1/1){
  #app{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);column-gap:22px;max-width:calc((100vh - 70px) * 9 / 13 + 420px);margin:0 auto}
  .hud{grid-column:1 / -1;padding:12px 16px 8px;gap:22px}
  .brand{display:block}
  .panel{grid-column:2;grid-row:2;grid-template-rows:112px auto minmax(0,1fr) auto;gap:10px;padding:6px 16px 18px 0}
  #hint{height:auto;white-space:normal;font-size:1rem;align-self:start}
  .panel.tw #hint{display:none}
  .panel.tw .shop{display:grid}
  .towerbox{grid-row:1;height:auto;flex-wrap:wrap;align-content:start;gap:8px}
  .towerbox .who{flex-basis:100%}
  .btn.act{flex:1 1 0;min-height:44px;flex-direction:row;gap:5px}
  .shop{grid-row:2;height:auto;grid-template-columns:1fr;gap:8px}
  .card{display:grid;grid-template-columns:48px 1fr auto;grid-template-areas:"ico nm cost" "ico ds ds";column-gap:10px;row-gap:2px;align-items:center;text-align:left;padding:8px 12px 9px 8px}
  .card canvas{grid-area:ico;width:48px;height:48px}
  .card .nm{grid-area:nm;font-size:1.08rem}
  .card .cost{grid-area:cost;font-size:1rem}
  .card .ds{grid-area:ds;display:block;font-size:.9rem;line-height:1.25;color:var(--parch-dim)}
  .controls{grid-row:4;flex-wrap:wrap}
  .keys{display:block;flex-basis:100%;margin:6px 0 0;font-size:.85rem;line-height:1.3;color:var(--parch-dim)}
}
@media (max-height:640px) and (max-width:859px){
  .shop,.towerbox{height:70px}
  .card canvas{width:26px;height:26px}
  .btn{min-height:42px}
}
@media (prefers-reduced-motion:reduce){
  .overlay,.stat.bump{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <span class="brand">Защита трона</span>
    <span class="stat" id="livesStat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#d8394a" d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.8 12 21 12 21z"/></svg>
      <span class="vh">Жизни трона:</span><span id="lives">20</span>
    </span>
    <span class="stat" id="goldStat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#e3b24a"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#a87a1f" stroke-width="2"/></svg>
      <span class="vh">Золото:</span><span id="gold">150</span>
    </span>
    <span class="wave" id="wave">Волна 1 из 20</span>
  </header>

  <main class="stage" id="stage">
    <canvas id="board" tabindex="0" aria-label="Тронный зал: игровое поле"></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <aside class="panel" id="panel">
    <p id="hint"></p>
    <div class="towerbox" id="towerbox" hidden>
      <div class="who"><b id="twName"></b><span id="twStat1"></span><span id="twStat2"></span></div>
      <button class="btn act primary" id="upBtn" type="button"><span id="upLabel">Улучшить</span><span class="pr" id="upPrice"></span></button>
      <button class="btn act" id="sellBtn" type="button"><span>Продать</span><span class="pr" id="sellPrice"></span></button>
    </div>
    <div class="shop" id="shop" role="group" aria-label="Стража"></div>
    <div class="controls">
      <button class="btn primary grow" id="waveBtn" type="button">Начать волну</button>
      <button class="btn icon" id="speedBtn" type="button" aria-label="Скорость игры">×1</button>
      <button class="btn icon" id="pauseBtn" type="button" aria-label="Пауза" aria-pressed="false"></button>
      <button class="btn icon" id="soundBtn" type="button" aria-label="Звук" aria-pressed="true"></button>
      <p class="keys">Клавиши: 1–4 выбирают стража, пробел начинает волну и ставит паузу, стрелки и Enter ставят стража без мыши.</p>
    </div>
  </aside>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h1 id="ovTitle">Защита трона</h1>
    <p id="ovText"></p>
    <p class="dim" id="ovNote"></p>
    <div class="row" id="ovRow"></div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= Правила и числа ================= */
const COLS = 9, ROWS = 13, STEP = 1 / 60, MAX_WAVE = 20, START_GOLD = 150, START_LIVES = 20;

const TOWERS = {
  archer: { name: 'Лучник', desc: 'быстрые стрелы, слаб против лат', cost: 50, up: [45, 85], kind: 'phys',
    lv: [{ dmg: 9, rate: .55, range: 2.3 }, { dmg: 15, rate: .5, range: 2.5 }, { dmg: 24, rate: .42, range: 2.8 }] },
  mage: { name: 'Огневик', desc: 'взрыв по площади, прожигает латы', cost: 90, up: [80, 130], kind: 'magic',
    lv: [{ dmg: 16, rate: 1.2, range: 2.2, splash: .9 }, { dmg: 27, rate: 1.1, range: 2.4, splash: 1 }, { dmg: 44, rate: 1, range: 2.6, splash: 1.15 }] },
  frost: { name: 'Морозко', desc: 'замедляет всех вокруг, сам почти не ранит', cost: 70, up: [60, 100], kind: 'magic',
    lv: [{ dmg: 3, rate: 1.1, range: 1.7, slow: .35, dur: 1.5 }, { dmg: 5, rate: 1.05, range: 1.9, slow: .45, dur: 1.8 }, { dmg: 8, rate: 1, range: 2.2, slow: .55, dur: 2.2 }] },
  ballista: { name: 'Баллиста', desc: 'бьёт далеко, пронзает нескольких', cost: 130, up: [110, 180], kind: 'pierce',
    lv: [{ dmg: 55, rate: 2.2, range: 3.6, pierce: 3 }, { dmg: 95, rate: 2, range: 4, pierce: 4 }, { dmg: 160, rate: 1.8, range: 4.5, pierce: 5 }] },
};
const TOWER_ORDER = ['archer', 'mage', 'frost', 'ballista'];

const ENEMIES = {
  rebel: { name: ['бунтовщик', 'бунтовщика', 'бунтовщиков'], hp: 30, speed: 1, armor: 0, reward: 6, dmg: 1, r: .2 },
  scout: { name: ['лазутчик', 'лазутчика', 'лазутчиков'], hp: 18, speed: 1.9, armor: 0, reward: 5, dmg: 1, r: .15 },
  armor: { name: ['латник', 'латника', 'латников'], hp: 90, speed: .65, armor: 5, reward: 14, dmg: 2, r: .23 },
  ogre: { name: ['огр', 'огра', 'огров'], hp: 320, speed: .5, armor: 0, reward: 40, dmg: 4, r: .33 },
  boss: { name: ['узурпатор', 'узурпатора', 'узурпаторов'], hp: 1500, speed: .4, armor: 4, reward: 200, dmg: 20, r: .42 },
};

// Волна: группы [кто, сколько, пауза между врагами (с), задержка начала (с)]
const WAVES = [
  [['rebel', 8, 1.1, 0]],
  [['rebel', 12, .9, 0]],
  [['rebel', 8, 1, 0], ['scout', 6, .6, 5]],
  [['scout', 14, .5, 0]],
  [['rebel', 10, .9, 0], ['armor', 3, 2, 4]],
  [['rebel', 12, .7, 0], ['scout', 8, .5, 6], ['armor', 2, 2, 10]],
  [['armor', 6, 1.6, 0], ['scout', 10, .45, 5]],
  [['ogre', 1, 0, 0], ['rebel', 14, .6, 2]],
  [['scout', 20, .35, 0], ['armor', 4, 1.5, 4]],
  [['ogre', 2, 5, 0], ['armor', 8, 1.3, 2]],
  [['rebel', 24, .4, 0], ['scout', 10, .4, 6]],
  [['armor', 12, 1, 0], ['ogre', 1, 0, 8]],
  [['scout', 30, .28, 0], ['ogre', 2, 4, 3]],
  [['armor', 10, .9, 0], ['rebel', 20, .4, 3], ['ogre', 2, 5, 10]],
  [['ogre', 5, 2.5, 0], ['scout', 16, .35, 4]],
  [['armor', 18, .75, 0], ['scout', 20, .3, 6]],
  [['ogre', 6, 2.2, 0], ['armor', 12, .8, 3]],
  [['rebel', 40, .25, 0], ['scout', 30, .25, 5], ['ogre', 3, 3, 10]],
  [['ogre', 8, 1.8, 0], ['armor', 20, .6, 4]],
  [['boss', 1, 0, 0], ['armor', 14, .9, 3], ['ogre', 4, 3, 8], ['scout', 24, .3, 14]],
];
function waveDef(n) {
  if (n <= WAVES.length) return WAVES[n - 1];
  const k = n - WAVES.length; // бесконечный режим
  const g = [['armor', 14 + 2 * k, .6, 0], ['ogre', 6 + k, 1.8, 3], ['scout', 24 + 3 * k, .25, 8]];
  if (n % 5 === 0) g.push(['boss', 1 + Math.floor(k / 10), 6, 0]);
  return g;
}
const TUNE = { hpGrow: 1.24, knee: 10, hpStep: 2.2, lateGrow: 1.08, bonusBase: 25, bonusPer: 5 };
// Здоровье врагов: быстрый рост до «колена», потом ровная прибавка, после 20-й волны снова проценты
function hpMul(w) {
  const k = TUNE.knee, atKnee = Math.pow(TUNE.hpGrow, k - 1);
  if (w <= k) return Math.pow(TUNE.hpGrow, w - 1);
  const at20 = atKnee + TUNE.hpStep * (MAX_WAVE - k);
  return w <= MAX_WAVE ? atKnee + TUNE.hpStep * (w - k) : at20 * Math.pow(TUNE.lateGrow, w - MAX_WAVE);
}
const waveBonus = w => TUNE.bonusBase + TUNE.bonusPer * w;

/* ================= Путь (ковёр) ================= */
const PTS = [[4.5, 13.5], [4.5, 10.5], [1.5, 10.5], [1.5, 7.5], [7.5, 7.5], [7.5, 4.5], [2.5, 4.5], [2.5, 2.5], [4.5, 2.5], [4.5, .8]];
const SEG = [], CUM = [0];
for (let i = 0; i < PTS.length - 1; i++) {
  SEG.push(Math.hypot(PTS[i + 1][0] - PTS[i][0], PTS[i + 1][1] - PTS[i][1]));
  CUM.push(CUM[i] + SEG[i]);
}
const PATH_LEN = CUM[CUM.length - 1];
function posAt(d) {
  if (d <= 0) return PTS[0];
  for (let i = 0; i < SEG.length; i++) {
    if (d <= CUM[i + 1]) {
      const f = (d - CUM[i]) / SEG[i];
      return [PTS[i][0] + (PTS[i + 1][0] - PTS[i][0]) * f, PTS[i][1] + (PTS[i + 1][1] - PTS[i][1]) * f];
    }
  }
  return PTS[PTS.length - 1];
}
const key = (c, r) => c + ',' + r;
const BLOCKED = new Set([key(3, 0), key(4, 0), key(5, 0)]);
for (let d = 0; d <= PATH_LEN; d += .1) {
  const [x, y] = posAt(d);
  const c = Math.floor(x), r = Math.floor(y);
  if (c >= 0 && c < COLS && r >= 0 && r < ROWS) BLOCKED.add(key(c, r));
}

/* ================= Состояние ================= */
const G = {
  state: 'menu', wave: 1, cleared: 0, gold: START_GOLD, lives: START_LIVES, score: 0, kills: 0, endless: false,
  towers: [], grid: new Map(), enemies: [], shots: [], fx: [], queue: [], waveT: 0, time: 0,
  armed: null, selTower: null, selTile: null, hover: null, kb: null,
  paused: false, speed: 1, shake: 0, hurt: 0, best: null,
};
try { G.best = JSON.parse(localStorage.getItem('throne-best') || 'null'); } catch (e) { G.best = null; }

const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b > 1 && b < 5 ? f[1] : f[2]; };
const fmt = n => n.toLocaleString('ru-RU');
const ROMAN = ['I', 'II', 'III'];

/* ================= Звук ================= */
const Sfx = (() => {
  let ac = null, muted = false, lastKill = 0;
  try { muted = localStorage.getItem('throne-muted') === '1'; } catch (e) {}
  function tone(f0, f1, dur, type, vol, delay) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  return {
    get muted() { return muted; },
    unlock() { if (muted) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} },
    toggle() { muted = !muted; try { localStorage.setItem('throne-muted', muted ? '1' : '0'); } catch (e) {} if (!muted) { this.unlock(); this.build(); } },
    build() { tone(380, 620, .09, 'triangle', .13); },
    upgrade() { tone(440, 660, .09, 'triangle', .13); tone(660, 990, .12, 'triangle', .11, .08); },
    sell() { tone(520, 300, .12, 'triangle', .1); },
    deny() { tone(160, 120, .12, 'square', .05); },
    kill() { const n = performance.now(); if (n - lastKill < 70) return; lastKill = n; tone(300, 140, .06, 'triangle', .07); },
    leak() { tone(120, 50, .3, 'sawtooth', .13); },
    wave() { tone(196, 196, .16, 'sawtooth', .06); tone(262, 262, .28, 'sawtooth', .06, .16); },
    win() { [392, 494, 587, 784].forEach((f, i) => tone(f, f, .22, 'triangle', .12, i * .13)); },
    lose() { [330, 262, 196, 131].forEach((f, i) => tone(f, f * .97, .3, 'sawtooth', .07, i * .2)); },
  };
})();

/* ================= Логика ================= */
const stat = t => TOWERS[t.type].lv[t.lv];
function invested(t) { const d = TOWERS[t.type]; let s = d.cost; for (let i = 0; i < t.lv; i++) s += d.up[i]; return s; }
const refund = t => Math.floor(invested(t) * .6);
const inGrid = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS;
const isFree = (c, r) => inGrid(c, r) && !BLOCKED.has(key(c, r)) && !G.grid.has(key(c, r));

function newGame() {
  Object.assign(G, {
    state: 'build', wave: 1, cleared: 0, gold: START_GOLD, lives: START_LIVES, score: 0, kills: 0, endless: false,
    towers: [], enemies: [], shots: [], fx: [], queue: [], waveT: 0, time: 0,
    armed: null, selTower: null, selTile: null, paused: false, shake: 0, hurt: 0,
  });
  G.grid = new Map();
  hideOverlay();
}

function build(type, c, r) {
  const d = TOWERS[type];
  if (!d || !isFree(c, r) || G.gold < d.cost) return false;
  G.gold -= d.cost;
  const t = { type, c, r, x: c + .5, y: r + .5, lv: 0, cd: 0, ang: -Math.PI / 2, pop: .25 };
  G.towers.push(t); G.grid.set(key(c, r), t);
  return true;
}
function upgrade(t) {
  const d = TOWERS[t.type];
  if (t.lv >= d.lv.length - 1 || G.gold < d.up[t.lv]) return false;
  G.gold -= d.up[t.lv]; t.lv++; t.pop = .25;
  return true;
}
function sell(t) {
  G.gold += refund(t);
  G.towers.splice(G.towers.indexOf(t), 1); G.grid.delete(key(t.c, t.r));
  if (G.selTower === t) G.selTower = null;
}

function startWave() {
  if (G.state !== 'build') return false;
  const q = [];
  for (const [type, count, gap, delay] of waveDef(G.wave)) for (let i = 0; i < count; i++) q.push({ t: delay + i * gap, type });
  q.sort((a, b) => b.t - a.t);
  G.queue = q; G.waveT = 0; G.state = 'wave'; G.paused = false;
  Sfx.wave();
  return true;
}
function spawn(type) {
  const d = ENEMIES[type], hp = Math.round(d.hp * hpMul(G.wave));
  G.enemies.push({ type, hp, maxHp: hp, d: 0, x: PTS[0][0], y: PTS[0][1], speed: d.speed, armor: d.armor, reward: d.reward, dmg: d.dmg, r: d.r,
    slowT: 0, slowF: 0, flash: 0, phase: Math.random() * 6.28, dead: false });
}

function hurt(e, dmg, kind) {
  if (e.dead) return;
  let v = dmg;
  if (kind === 'phys') v = Math.max(1, dmg - e.armor);
  else if (kind === 'pierce') v = Math.max(1, dmg - e.armor * .5);
  e.hp -= v; e.flash = .09;
  if (e.hp <= 0) {
    e.dead = true; G.gold += e.reward; G.score += e.reward * 10; G.kills++;
    addFx({ k: 'text', x: e.x, y: e.y - e.r, str: '+' + e.reward, life: .8, max: .8 });
    burst(e.x, e.y, COLORS[e.type], e.type === 'boss' ? 22 : e.type === 'ogre' ? 10 : 5);
    Sfx.kill();
  }
}
function leak(e) {
  e.dead = true; G.lives -= e.dmg; G.shake = .35; G.hurt = .5;
  Sfx.leak(); bump(livesStat);
  if (G.lives <= 0) { G.lives = 0; gameOver(); }
}

function fire(t, e, s) {
  t.ang = Math.atan2(e.y - t.y, e.x - t.x);
  if (t.type === 'archer') G.shots.push({ k: 'arrow', x: t.x, y: t.y, target: e, tx: e.x, ty: e.y, speed: 11, dmg: s.dmg, ang: t.ang });
  else if (t.type === 'mage') G.shots.push({ k: 'orb', x: t.x, y: t.y, target: e, tx: e.x, ty: e.y, speed: 6.5, dmg: s.dmg, splash: s.splash });
  else if (t.type === 'ballista') {
    const dist = Math.hypot(e.x - t.x, e.y - t.y) || 1;
    G.shots.push({ k: 'bolt', x: t.x, y: t.y, dx: (e.x - t.x) / dist, dy: (e.y - t.y) / dist, speed: 18, left: s.range * 1.15, dmg: s.dmg, pierce: s.pierce, hit: new Set(), ang: t.ang });
  } else {
    const r2 = s.range * s.range;
    for (const o of G.enemies) {
      if (o.dead || (o.x - t.x) ** 2 + (o.y - t.y) ** 2 > r2) continue;
      const f = o.type === 'boss' ? s.slow * .5 : s.slow;
      o.slowF = o.slowT > 0 ? Math.max(o.slowF, f) : f; o.slowT = Math.max(o.slowT, s.dur);
      hurt(o, s.dmg, 'magic');
    }
    addFx({ k: 'ring', x: t.x, y: t.y, r0: .25, r1: s.range, life: .45, max: .45 });
  }
}
function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let f = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; f = Math.max(0, Math.min(1, f));
  return Math.hypot(px - ax - dx * f, py - ay - dy * f);
}

function step(dt) {
  G.time += dt;
  if (G.state === 'wave') {
    G.waveT += dt;
    while (G.queue.length && G.queue[G.queue.length - 1].t <= G.waveT) spawn(G.queue.pop().type);
  }
  // враги идут по ковру
  for (const e of G.enemies) {
    let sp = e.speed;
    if (e.slowT > 0) { sp *= 1 - e.slowF; e.slowT -= dt; }
    if (e.flash > 0) e.flash -= dt;
    e.d += sp * dt;
    if (e.d >= PATH_LEN) { leak(e); if (G.state === 'over') return; continue; }
    const p = posAt(e.d); e.x = p[0]; e.y = p[1];
  }
  // стража стреляет по тому, кто ближе всех к трону
  for (const t of G.towers) {
    if (t.pop > 0) t.pop -= dt;
    t.cd -= dt;
    if (t.cd > 0) continue;
    const s = stat(t), r2 = s.range * s.range;
    let best = null;
    for (const e of G.enemies) {
      if (e.dead) continue;
      const dx = e.x - t.x, dy = e.y - t.y;
      if (dx * dx + dy * dy <= r2 && (!best || e.d > best.d)) best = e;
    }
    if (!best) { t.cd = 0; continue; }
    t.cd = s.rate; fire(t, best, s);
  }
  // снаряды
  for (const s of G.shots) {
    if (s.k === 'bolt') {
      const mv = Math.min(s.speed * dt, s.left), nx = s.x + s.dx * mv, ny = s.y + s.dy * mv;
      for (const e of G.enemies) {
        if (e.dead || s.hit.has(e)) continue;
        if (distSeg(e.x, e.y, s.x, s.y, nx, ny) <= e.r + .1) { s.hit.add(e); hurt(e, s.dmg, 'pierce'); if (--s.pierce <= 0) { s.done = true; break; } }
      }
      s.x = nx; s.y = ny; s.left -= mv; if (s.left <= 0) s.done = true;
    } else {
      if (!s.target.dead) { s.tx = s.target.x; s.ty = s.target.y; }
      const dx = s.tx - s.x, dy = s.ty - s.y, dist = Math.hypot(dx, dy), mv = s.speed * dt;
      if (dist <= mv) {
        s.done = true;
        if (s.k === 'arrow') { if (!s.target.dead) hurt(s.target, s.dmg, 'phys'); }
        else {
          for (const e of G.enemies) if (!e.dead && Math.hypot(e.x - s.tx, e.y - s.ty) <= s.splash + e.r * .5) hurt(e, s.dmg, 'magic');
          addFx({ k: 'boom', x: s.tx, y: s.ty, r1: s.splash, life: .3, max: .3 });
        }
      } else { s.x += dx / dist * mv; s.y += dy / dist * mv; s.ang = Math.atan2(dy, dx); }
    }
  }
  if (G.shots.some(s => s.done)) G.shots = G.shots.filter(s => !s.done);
  if (G.enemies.some(e => e.dead)) G.enemies = G.enemies.filter(e => !e.dead);
  // эффекты
  for (const f of G.fx) {
    f.life -= dt;
    if (f.k === 'spark') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 2.5 * dt; }
    else if (f.k === 'text') f.y -= .7 * dt;
  }
  if (G.fx.length && G.fx[0].life <= 0 || G.fx.length > 40) G.fx = G.fx.filter(f => f.life > 0);
  if (G.state === 'wave' && !G.queue.length && !G.enemies.length) waveCleared();
}

function waveCleared() {
  G.gold += waveBonus(G.wave); G.score += 100 * G.wave; G.cleared = G.wave;
  bump(goldStat);
  if (G.wave === MAX_WAVE && !G.endless) {
    G.score += G.lives * 100; G.state = 'won'; saveBest(); Sfx.win(); showVictory();
  } else { G.state = 'build'; G.wave++; }
}
function gameOver() { G.state = 'over'; saveBest(); Sfx.lose(); showDefeat(); }
function saveBest() {
  G.newBest = !G.best || G.score > G.best.score;
  if (G.newBest) { G.best = { score: G.score, wave: G.cleared }; try { localStorage.setItem('throne-best', JSON.stringify(G.best)); } catch (e) {} }
}

function addFx(f) { if (G.fx.length < 260) G.fx.push(f); }
function burst(x, y, color, n) {
  if (reduceMotion) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = .8 + Math.random() * 1.8, life = .3 + Math.random() * .3;
    addFx({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .6, life, max: life, color });
  }
}

/* ================= Рисование ================= */
const COLORS = { rebel: '#c98f55', scout: '#3a8a83', armor: '#a9b4c6', ogre: '#86a24e', boss: '#7a45b8' };
const GOLD = '#e3b24a', CRIMSON = '#a8212f', PARCH = '#f3e9d2';
const cv = document.getElementById('board'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let T = 40, dpr = 1, S = 40, layer = null;

function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, 6.2832); }
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
const hash = (c, r) => { const v = Math.sin(c * 127.1 + r * 311.7) * 43758.5453; return v - Math.floor(v); };

function resize() {
  const box = stage.getBoundingClientRect();
  if (!box.width || !box.height) return;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  T = Math.max(16, Math.floor(Math.min((box.width - 10) / COLS, (box.height - 10) / ROWS)));
  cv.style.width = COLS * T + 'px'; cv.style.height = ROWS * T + 'px';
  cv.width = Math.round(COLS * T * dpr); cv.height = Math.round(ROWS * T * dpr);
  S = cv.width / COLS;
  buildLayer();
  drawShopIcons();
}

// Неподвижная часть зала рисуется один раз
function buildLayer() {
  layer = document.createElement('canvas'); layer.width = cv.width; layer.height = cv.height;
  const g = layer.getContext('2d'); g.scale(S, S);
  g.fillStyle = '#171a28'; g.fillRect(0, 0, COLS, ROWS);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const l = 22 + ((c + r) & 1) * 2.4 + (hash(c, r) - .5) * 2.6;
    g.fillStyle = `hsl(231,24%,${l}%)`; g.fillRect(c + .025, r + .025, .95, .95);
    g.fillStyle = 'rgba(255,255,255,.04)'; g.fillRect(c + .025, r + .025, .95, .04);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(c + .025, r + .935, .95, .04);
  }
  let gr = g.createRadialGradient(4.5, .6, .2, 4.5, .6, 6);
  gr.addColorStop(0, 'rgba(240,150,70,.3)'); gr.addColorStop(1, 'rgba(240,150,70,0)');
  g.fillStyle = gr; g.fillRect(0, 0, COLS, ROWS);
  // помост
  g.fillStyle = '#4c5378'; rr(g, 3.05, .05, 2.9, .92, .08); g.fill();
  g.fillStyle = '#5f6790'; rr(g, 3.18, .05, 2.64, .76, .06); g.fill();
  g.fillStyle = GOLD; g.fillRect(3.18, .8, 2.64, .03);
  // ковёр
  const trace = () => { g.beginPath(); g.moveTo(PTS[0][0], PTS[0][1]); for (let i = 1; i < PTS.length; i++) g.lineTo(PTS[i][0], PTS[i][1]); };
  g.lineJoin = 'miter'; g.lineCap = 'butt';
  trace(); g.strokeStyle = 'rgba(8,9,18,.5)'; g.lineWidth = .9; g.stroke();
  trace(); g.strokeStyle = GOLD; g.lineWidth = .8; g.stroke();
  trace(); g.strokeStyle = CRIMSON; g.lineWidth = .69; g.stroke();
  trace(); g.strokeStyle = '#8c1826'; g.lineWidth = .34; g.stroke();
  g.fillStyle = 'rgba(227,178,74,.6)';
  for (let d = .25; d < PATH_LEN - .3; d += .5) {
    const [x, y] = posAt(d);
    g.beginPath(); g.moveTo(x, y - .075); g.lineTo(x + .075, y); g.lineTo(x, y + .075); g.lineTo(x - .075, y); g.closePath(); g.fill();
  }
  // дверь
  const dg = g.createLinearGradient(0, 12.25, 0, 13); dg.addColorStop(0, 'rgba(6,6,14,0)'); dg.addColorStop(1, 'rgba(6,6,14,.9)');
  g.fillStyle = dg; g.fillRect(4.02, 12.25, .96, .75);
  g.fillStyle = '#565d85'; g.fillRect(3.88, 12.5, .16, .5); g.fillRect(4.96, 12.5, .16, .5);
  g.fillStyle = '#7880ab'; g.fillRect(3.88, 12.5, .16, .05); g.fillRect(4.96, 12.5, .16, .05);
  // затемнение по краям
  gr = g.createRadialGradient(4.5, 6, 4, 4.5, 6.5, 9.5);
  gr.addColorStop(0, 'rgba(8,9,18,0)'); gr.addColorStop(1, 'rgba(8,9,18,.55)');
  g.fillStyle = gr; g.fillRect(0, 0, COLS, ROWS);
}

function drawTower(c, type, lv, ang, time, ready) {
  c.fillStyle = 'rgba(8,9,18,.45)'; circle(c, 0, .05, .39); c.fill();
  c.fillStyle = '#5a6186'; circle(c, 0, 0, .37); c.fill();
  c.fillStyle = '#3b4162'; circle(c, 0, 0, .3); c.fill();
  c.save();
  if (type === 'archer') {
    c.rotate(ang);
    c.fillStyle = '#3f8750'; circle(c, -.03, 0, .18); c.fill();
    c.fillStyle = '#5fae6b'; circle(c, -.05, 0, .12); c.fill();
    c.strokeStyle = '#d6ab6c'; c.lineWidth = .05; c.lineCap = 'round';
    c.beginPath(); c.arc(.02, 0, .25, -1.15, 1.15); c.stroke();
    c.strokeStyle = PARCH; c.lineWidth = .02;
    const bx = .02 + Math.cos(1.15) * .25, by = Math.sin(1.15) * .25;
    c.beginPath(); c.moveTo(bx, -by); c.lineTo(ready ? -.02 : bx, 0); c.lineTo(bx, by); c.stroke();
    if (ready) { c.lineWidth = .03; c.beginPath(); c.moveTo(-.02, 0); c.lineTo(.3, 0); c.stroke(); }
  } else if (type === 'mage') {
    c.fillStyle = '#a34a1e'; c.beginPath();
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? .12 : .25; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    c.closePath(); c.fill();
    c.fillStyle = '#d9702e'; circle(c, 0, 0, .14); c.fill();
    const p = .5 + .5 * Math.sin(time * 5);
    c.fillStyle = `rgba(255,190,90,${.25 + p * .25})`; circle(c, 0, 0, .12 + p * .03); c.fill();
    c.fillStyle = '#ffd98a'; circle(c, 0, 0, .07); c.fill();
  } else if (type === 'frost') {
    c.rotate(time * .5);
    c.strokeStyle = '#cdeffc'; c.lineWidth = .05; c.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      c.rotate(Math.PI / 3);
      c.beginPath(); c.moveTo(0, 0); c.lineTo(.25, 0); c.moveTo(.16, 0); c.lineTo(.22, .06); c.moveTo(.16, 0); c.lineTo(.22, -.06); c.stroke();
    }
    c.fillStyle = '#8fd8ee'; c.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; c.lineTo(Math.cos(a) * .1, Math.sin(a) * .1); }
    c.closePath(); c.fill();
  } else {
    c.rotate(ang);
    c.fillStyle = '#8a5d30'; rr(c, -.24, -.06, .5, .12, .03); c.fill();
    c.strokeStyle = '#c08a4c'; c.lineWidth = .065; c.lineCap = 'round';
    c.beginPath(); c.moveTo(.08, -.3); c.quadraticCurveTo(.3, 0, .08, .3); c.stroke();
    c.strokeStyle = PARCH; c.lineWidth = .02;
    c.beginPath(); c.moveTo(.08, -.3); c.lineTo(ready ? -.16 : .1, 0); c.lineTo(.08, .3); c.stroke();
    if (ready) {
      c.strokeStyle = '#dfe5f2'; c.lineWidth = .045; c.beginPath(); c.moveTo(-.16, 0); c.lineTo(.32, 0); c.stroke();
      c.fillStyle = '#dfe5f2'; c.beginPath(); c.moveTo(.4, 0); c.lineTo(.3, -.055); c.lineTo(.3, .055); c.closePath(); c.fill();
    }
  }
  c.restore();
  c.fillStyle = GOLD;
  for (let i = 0; i <= lv; i++) { circle(c, (i - lv / 2) * .13, .32, .042); c.fill(); }
}

    c.fillStyle = '#ff5a4a'; circle(c, -.1, 0, .04); c.fill(); circle(c, .1, 0, .04); c.fill();
    c.fillStyle = GOLD; c.beginPath(); c.moveTo(-.22, -.2); c.lineTo(-.24, -.44); c.lineTo(-.11, -.32); c.lineTo(0, -.48); c.lineTo(.11, -.32); c.lineTo(.24, -.44); c.lineTo(.22, -.2); c.closePath(); c.fill();
  }
  if (e.slowT > 0) { c.strokeStyle = 'rgba(170,230,255,.9)'; c.lineWidth = .04; circle(c, 0, 0, r + .04); c.stroke(); }
  if (e.flash > 0) { c.fillStyle = 'rgba(255,255,255,.55)'; circle(c, 0, 0, r); c.fill(); }
  if (e.hp < e.maxHp) {
    const w = Math.max(.36, r * 2), f = Math.max(0, e.hp / e.maxHp), y = -r - (e.type === 'boss' ? .32 : .16);
    c.fillStyle = 'rgba(8,9,18,.75)'; c.fillRect(-w / 2 - .015, y - .015, w + .03, .085);
    c.fillStyle = f > .5 ? '#7fd16a' : f > .25 ? GOLD : '#f0863a'; c.fillRect(-w / 2, y, w * f, .055);
  }
  c.restore();
}

function drawThrone(c, time) {
  c.save(); c.translate(4.5, .46);
  c.fillStyle = '#a87a1f'; c.beginPath(); c.moveTo(-.29, .3); c.lineTo(-.29, -.16); c.quadraticCurveTo(0, -.56, .29, -.16); c.lineTo(.29, .3); c.closePath(); c.fill();
  c.fillStyle = GOLD; c.beginPath(); c.moveTo(-.24, .3); c.lineTo(-.24, -.14); c.quadraticCurveTo(0, -.48, .24, -.14); c.lineTo(.24, .3); c.closePath(); c.fill();
  c.fillStyle = CRIMSON; c.beginPath(); c.moveTo(-.17, .14); c.lineTo(-.17, -.1); c.quadraticCurveTo(0, -.34, .17, -.1); c.lineTo(.17, .14); c.closePath(); c.fill();
  c.fillStyle = GOLD; rr(c, -.36, .1, .72, .17, .04); c.fill();
  c.fillStyle = '#a87a1f'; c.fillRect(-.36, .23, .72, .05);
  c.fillStyle = GOLD; rr(c, -.4, -.06, .11, .3, .04); c.fill(); rr(c, .29, -.06, .11, .3, .04); c.fill();
  circle(c, -.345, -.08, .06); c.fill(); circle(c, .345, -.08, .06); c.fill(); circle(c, 0, -.37, .055); c.fill();
  if (G.hurt > 0) { c.fillStyle = `rgba(255,70,60,${Math.min(.6, G.hurt)})`; circle(c, 0, 0, .5); c.fill(); }
  c.restore();
  for (const x of [3.42, 5.58]) {
    const f = reduceMotion ? 1 : .92 + Math.sin(time * 11 + x) * .08 + Math.sin(time * 17 + x * 3) * .05, y = .5;
    c.fillStyle = '#20233a'; rr(c, x - .13, y + .04, .26, .16, .05); c.fill();
    c.fillStyle = 'rgba(240,134,58,.95)'; c.beginPath(); c.moveTo(x - .1, y + .08); c.quadraticCurveTo(x - .14, y - .1 * f, x, y - .3 * f); c.quadraticCurveTo(x + .14, y - .1 * f, x + .1, y + .08); c.closePath(); c.fill();
    c.fillStyle = 'rgba(255,224,130,.95)'; c.beginPath(); c.moveTo(x - .05, y + .08); c.quadraticCurveTo(x - .07, y - .04 * f, x, y - .16 * f); c.quadraticCurveTo(x + .07, y - .04 * f, x + .05, y + .08); c.closePath(); c.fill();
  }
}

function drawRange(x, y, range, ok) {
  ctx.fillStyle = ok ? 'rgba(243,233,210,.07)' : 'rgba(240,90,70,.08)'; circle(ctx, x, y, range); ctx.fill();
  ctx.strokeStyle = ok ? 'rgba(227,178,74,.75)' : 'rgba(240,110,80,.8)'; ctx.lineWidth = .03; ctx.setLineDash([.14, .1]); ctx.stroke(); ctx.setLineDash([]);
}

let shx = 0, shy = 0, lastTs = 0, acc = 0;
function render(realDt) {
  const time = G.time;
  if (G.shake > 0) G.shake -= realDt;
  if (G.hurt > 0) G.hurt -= realDt;
  if (G.shake > 0 && !reduceMotion) { shx = (Math.random() - .5) * G.shake * .5 * S; shy = (Math.random() - .5) * G.shake * .5 * S; } else shx = shy = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#171a28'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (layer) ctx.drawImage(layer, shx, shy);
  ctx.setTransform(S, 0, 0, S, shx, shy);

  const playing = G.state === 'build' || G.state === 'wave';
  if (playing && (G.armed || G.selTile)) {
    ctx.fillStyle = 'rgba(227,178,74,.3)';
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (isFree(c, r)) { circle(ctx, c + .5, r + .5, .05); ctx.fill(); }
  }
  if (G.selTile) { ctx.strokeStyle = GOLD; ctx.lineWidth = .05; ctx.setLineDash([.16, .1]); ctx.strokeRect(G.selTile.c + .07, G.selTile.r + .07, .86, .86); ctx.setLineDash([]); }
  if (G.selTower) drawRange(G.selTower.x, G.selTower.y, stat(G.selTower).range, true);

  drawThrone(ctx, time);

  for (const t of G.towers) {
    ctx.save(); ctx.translate(t.x, t.y);
    if (t.pop > 0 && !reduceMotion) { const k = 1 + t.pop * .8; ctx.scale(k, k); }
    drawTower(ctx, t.type, t.lv, t.ang, time, t.cd < stat(t).rate * .55);
    if (G.selTower === t) { ctx.strokeStyle = GOLD; ctx.lineWidth = .045; circle(ctx, 0, 0, .41); ctx.stroke(); }
    ctx.restore();
  }
  for (const e of G.enemies) if (e.type !== 'boss') drawEnemy(ctx, e, time);
  for (const e of G.enemies) if (e.type === 'boss') drawEnemy(ctx, e, time);

  for (const s of G.shots) {
    if (s.k === 'orb') {
      ctx.fillStyle = 'rgba(255,140,40,.35)'; circle(ctx, s.x, s.y, .17); ctx.fill();
      ctx.fillStyle = '#ffc266'; circle(ctx, s.x, s.y, .09); ctx.fill();
    } else {
      const len = s.k === 'bolt' ? .5 : .24;
      ctx.strokeStyle = s.k === 'bolt' ? '#dfe5f2' : PARCH; ctx.lineWidth = s.k === 'bolt' ? .055 : .035; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x - Math.cos(s.ang) * len, s.y - Math.sin(s.ang) * len); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
  }
  for (const f of G.fx) {
    if (f.life <= 0) continue;
    const a = f.life / f.max;
    if (f.k === 'ring') { ctx.strokeStyle = `rgba(170,230,255,${a * .8})`; ctx.lineWidth = .05; circle(ctx, f.x, f.y, f.r0 + (f.r1 - f.r0) * (1 - a)); ctx.stroke(); }
    else if (f.k === 'boom') { ctx.fillStyle = `rgba(255,140,50,${a * .45})`; circle(ctx, f.x, f.y, f.r1 * (1 - a * .6)); ctx.fill(); }
    else if (f.k === 'spark') { ctx.globalAlpha = a; ctx.fillStyle = f.color; ctx.fillRect(f.x - .035, f.y - .035, .07, .07); ctx.globalAlpha = 1; }
  }

  // призрак стража под курсором
  const ghost = playing && G.armed && (G.hover || G.kb);
  if (ghost && isFree(ghost.c, ghost.r)) {
    const d = TOWERS[G.armed], ok = G.gold >= d.cost;
    drawRange(ghost.c + .5, ghost.r + .5, d.lv[0].range, ok);
    ctx.save(); ctx.translate(ghost.c + .5, ghost.r + .5); ctx.globalAlpha = ok ? .7 : .35;
    drawTower(ctx, G.armed, 0, -Math.PI / 2, time, true); ctx.restore();
  }
  if (playing && G.kb) { ctx.strokeStyle = PARCH; ctx.lineWidth = .045; ctx.strokeRect(G.kb.c + .04, G.kb.r + .04, .92, .92); }

  // надписи рисуются в пикселях, чтобы шрифт не мылился
  ctx.setTransform(dpr, 0, 0, dpr, shx, shy);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `800 ${Math.round(T * .34)}px "Alegreya Sans",system-ui,sans-serif`;
  for (const f of G.fx) {
    if (f.k !== 'text' || f.life <= 0) continue;
    ctx.globalAlpha = Math.min(1, f.life / f.max * 2);
    ctx.fillStyle = 'rgba(8,9,18,.8)'; ctx.fillText(f.str, f.x * T + 1, f.y * T + 1);
    ctx.fillStyle = GOLD; ctx.fillText(f.str, f.x * T, f.y * T);
  }
  ctx.globalAlpha = 1;
  if (G.hurt > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const gr = ctx.createRadialGradient(cv.width / 2, cv.height / 2, cv.height * .25, cv.width / 2, cv.height / 2, cv.height * .7);
    gr.addColorStop(0, 'rgba(200,30,40,0)'); gr.addColorStop(1, `rgba(200,30,40,${Math.min(.5, G.hurt)})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, cv.width, cv.height);
  }
}

function frame(ts) {
  const realDt = Math.min(.1, (ts - lastTs) / 1000 || 0); lastTs = ts;
  if ((G.state === 'build' || G.state === 'wave') && !G.paused) {
    acc += realDt * G.speed;
    while (acc >= STEP) { acc -= STEP; step(STEP); if (G.state === 'over' || G.state === 'won') { acc = 0; break; } }
  }
  render(realDt); syncUI();
  requestAnimationFrame(frame);
}

/* ================= Интерфейс ================= */
const $ = id => document.getElementById(id);
const livesStat = $('livesStat'), goldStat = $('goldStat');
const els = { lives: $('lives'), gold: $('gold'), wave: $('wave'), panel: $('panel'), hint: $('hint'), towerbox: $('towerbox'), twName: $('twName'), twStat1: $('twStat1'), twStat2: $('twStat2'),
  up: $('upBtn'), upLabel: $('upLabel'), upPrice: $('upPrice'), sell: $('sellBtn'), sellPrice: $('sellPrice'), waveBtn: $('waveBtn'), speed: $('speedBtn'), pause: $('pauseBtn'), sound: $('soundBtn'), toast: $('toast'),
  overlay: $('overlay'), ovTitle: $('ovTitle'), ovText: $('ovText'), ovNote: $('ovNote'), ovRow: $('ovRow'), shop: $('shop') };
const COIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>';
const ICON = {
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4l13 8-13 8z"/></svg>',
  soundOn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  soundOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M17 9l5 6M22 9l-5 6"/></svg>',
};

const cards = TOWER_ORDER.map((type, i) => {
  const d = TOWERS[type], b = document.createElement('button');
  b.type = 'button'; b.className = 'card'; b.dataset.type = type; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<canvas width="96" height="96" aria-hidden="true"></canvas><span class="nm">${d.name}</span><span class="cost">${COIN}<span class="vh">цена</span>${d.cost}</span><span class="ds">${d.desc}</span>`;
  b.addEventListener('click', () => pickCard(type));
  els.shop.appendChild(b);
  return b;
});
function drawShopIcons() {
  for (const b of cards) {
    const c = b.querySelector('canvas').getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 96, 96);
    c.setTransform(104, 0, 0, 104, 48, 46);
    drawTower(c, b.dataset.type, 0, -Math.PI / 2, 0, true);
  }
}

let toastTimer = 0;
function toast(msg) { els.toast.textContent = msg; els.toast.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => els.toast.classList.remove('on'), 1700); }
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
const playing = () => G.state === 'build' || G.state === 'wave';

function tryBuild(type, c, r) {
  const d = TOWERS[type];
  if (G.gold < d.cost) { toast(`Не хватает золота: ${d.name} стоит ${d.cost}`); bump(goldStat); Sfx.deny(); return false; }
  if (!build(type, c, r)) return false;
  Sfx.build();
  return true;
}
function pickCard(type) {
  if (!playing()) return;
  if (G.selTile && isFree(G.selTile.c, G.selTile.r)) { if (tryBuild(type, G.selTile.c, G.selTile.r)) G.selTile = null; return; }
  G.armed = G.armed === type ? null : type; G.selTower = null;
}
function tapTile(c, r) {
  if (!playing() || !inGrid(c, r)) return;
  const t = G.grid.get(key(c, r));
  if (t) { G.selTower = G.selTower === t ? null : t; G.armed = null; G.selTile = null; return; }
  G.selTower = null;
  if (!isFree(c, r)) { G.selTile = null; return; }
  if (G.armed) { tryBuild(G.armed, c, r); return; }
  G.selTile = G.selTile && G.selTile.c === c && G.selTile.r === r ? null : { c, r };
}
function tileAt(ev) {
  const b = cv.getBoundingClientRect();
  return { c: Math.floor((ev.clientX - b.left) / b.width * COLS), r: Math.floor((ev.clientY - b.top) / b.height * ROWS) };
}
cv.addEventListener('pointerdown', ev => { ev.preventDefault(); const p = tileAt(ev); G.kb = null; tapTile(p.c, p.r); });
cv.addEventListener('pointermove', ev => { if (ev.pointerType === 'mouse') { const p = tileAt(ev); G.hover = inGrid(p.c, p.r) ? p : null; } });
cv.addEventListener('pointerleave', () => { G.hover = null; });

els.up.addEventListener('click', () => {
  const t = G.selTower; if (!t) return;
  if (upgrade(t)) Sfx.upgrade(); else if (t.lv < 2) { toast('Не хватает золота на улучшение'); bump(goldStat); Sfx.deny(); }
});
els.sell.addEventListener('click', () => { if (G.selTower) { sell(G.selTower); Sfx.sell(); } });
els.waveBtn.addEventListener('click', () => { startWave(); });
els.speed.addEventListener('click', () => { G.speed = G.speed % 3 + 1; });
els.pause.addEventListener('click', () => { if (playing()) G.paused = !G.paused; });
els.sound.addEventListener('click', () => { Sfx.toggle(); });
for (const type of ['pointerup', 'click', 'keydown']) document.addEventListener(type, () => Sfx.unlock(), { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'wave') G.paused = true; });

document.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const onButton = ev.target instanceof HTMLButtonElement;
  if (ev.key >= '1' && ev.key <= '4') { pickCard(TOWER_ORDER[+ev.key - 1]); return; }
  if (ev.key === 'Escape') { G.armed = null; G.selTower = null; G.selTile = null; return; }
  if (!playing()) return;
  if ((ev.key === ' ' || ev.code === 'Space') && !onButton) { ev.preventDefault(); if (G.state === 'build') startWave(); else G.paused = !G.paused; return; }
  const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
  if (mv) {
    ev.preventDefault();
    const k = G.kb || { c: 4, r: 6 };
    G.kb = { c: Math.max(0, Math.min(COLS - 1, k.c + mv[0])), r: Math.max(0, Math.min(ROWS - 1, k.r + mv[1])) };
    return;
  }
  if (ev.key === 'Enter' && G.kb && !onButton) { ev.preventDefault(); tapTile(G.kb.c, G.kb.r); }
});

function previewText(n) {
  const m = new Map();
  for (const [type, count] of waveDef(n)) m.set(type, (m.get(type) || 0) + count);
  return [...m].map(([type, count]) => count + ' ' + plural(count, ENEMIES[type].name)).join(', ');
}
const num = v => String(v).replace('.', ',');
const pct = v => Math.round(v * 100) + '%';
let uiSig = '';
function syncUI() {
  const t = G.selTower, left = G.queue.length + G.enemies.length;
  const sig = [G.state, G.gold, G.lives, G.wave, G.endless, G.towers.length, G.armed, t ? t.c + '.' + t.r + '.' + t.lv : '', G.selTile ? G.selTile.c + '.' + G.selTile.r : '', left, G.paused, G.speed, Sfx.muted].join('|');
  if (sig === uiSig) return; uiSig = sig;
  els.lives.textContent = G.lives; els.gold.textContent = G.gold;
  livesStat.classList.toggle('low', G.lives <= 5);
  els.wave.textContent = G.wave > MAX_WAVE ? `Волна ${G.wave}` : `Волна ${G.wave} из ${MAX_WAVE}`;
  for (const b of cards) { const type = b.dataset.type; b.classList.toggle('poor', G.gold < TOWERS[type].cost); b.setAttribute('aria-pressed', String(G.armed === type)); }
  els.waveBtn.disabled = G.state !== 'build';
  els.waveBtn.textContent = G.state === 'wave' ? 'Идёт бой' : 'Начать волну';
  els.speed.textContent = '×' + G.speed;
  els.pause.innerHTML = G.paused ? ICON.play : ICON.pause;
  els.pause.setAttribute('aria-pressed', String(G.paused)); els.pause.setAttribute('aria-label', G.paused ? 'Продолжить' : 'Пауза');
  els.sound.innerHTML = Sfx.muted ? ICON.soundOff : ICON.soundOn; els.sound.setAttribute('aria-pressed', String(!Sfx.muted));
  els.towerbox.hidden = !t; els.panel.classList.toggle('tw', !!t);
  if (t) {
    const d = TOWERS[t.type], s = stat(t), max = t.lv >= d.lv.length - 1, n = max ? null : d.lv[t.lv + 1];
    const row = (label, cur, next) => next == null || next === cur ? `${label} ${cur}` : `${label} ${cur} → ${next}`;
    els.twName.textContent = `${d.name} ${ROMAN[t.lv]}`;
    els.twStat1.textContent = t.type === 'frost' ? row('замедление', pct(s.slow), n && pct(n.slow)) : row('урон', s.dmg, n && n.dmg);
    els.twStat2.textContent = row('дальность', num(s.range), n && num(n.range));
    els.upLabel.textContent = max ? 'Высший' : 'Улучшить'; els.upPrice.textContent = max ? 'уровень' : `за ${d.up[t.lv]}`;
    els.up.disabled = max; els.up.classList.toggle('primary', !max && G.gold >= d.up[t.lv]);
    els.sellPrice.textContent = `за ${refund(t)}`;
  }
  els.hint.textContent = t ? `${TOWERS[t.type].name}: ${TOWERS[t.type].desc}`
    : G.paused ? 'Пауза. Стражу можно ставить и улучшать'
    : G.armed ? `${TOWERS[G.armed].name}: ${TOWERS[G.armed].desc}`
    : G.selTile ? 'Выберите стража для этой плиты'
    : G.state === 'wave' ? `Врагов осталось: ${left}`
    : G.state === 'over' || G.state === 'won' ? ''
    : G.state === 'build' && G.wave === 1 && !G.towers.length ? 'Выберите стража и нажмите на плиту у ковра'
    : `Дальше: ${previewText(G.wave)}`;
}

/* ================= Заставка, итоги, рекорд ================= */
function showOverlay(title, text, note, buttons) {
  els.ovTitle.textContent = title; els.ovText.textContent = text; els.ovNote.textContent = note || ''; els.ovNote.hidden = !note;
  els.ovRow.textContent = '';
  buttons.forEach(([label, fn], i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (i ? '' : ' primary'); b.textContent = label;
    b.addEventListener('click', fn); els.ovRow.appendChild(b);
  });
  els.overlay.hidden = false;
  const first = els.ovRow.firstChild; if (first) first.focus({ preventScroll: true });
}
function hideOverlay() { els.overlay.hidden = true; }
function bestNote() { return G.newBest ? 'Это ваш новый рекорд.' : G.best ? `Ваш рекорд: ${fmt(G.best.score)}.` : ''; }
function showMenu() {
  showOverlay('Защита трона', 'Мятежники ломятся в тронный зал. Расставьте стражу вдоль ковра и не подпустите их к трону.',
    G.best ? `Ваш рекорд: ${fmt(G.best.score)}, отбито волн: ${G.best.wave}.` : 'Выберите стража и нажмите на свободную плиту. Нажмите на поставленного стража, чтобы улучшить его или продать.',
    [['Играть', newGame]]);
}
function showDefeat() {
  showOverlay('Трон пал', `Отбито волн: ${G.cleared}. Счёт: ${fmt(G.score)}.`, bestNote(), [['Сыграть ещё раз', newGame], ['Поделиться результатом', share]]);
}
function showVictory() {
  showOverlay('Трон устоял', `Все ${MAX_WAVE} волн отбиты. Счёт: ${fmt(G.score)}.`, bestNote(),
    [['Играть дальше', () => { G.endless = true; G.state = 'build'; G.wave++; hideOverlay(); }], ['Поделиться результатом', share], ['Начать заново', newGame]]);
}
async function share() {
  const url = location.origin && location.origin !== 'null' ? location.origin + location.pathname : '';
  const text = `Мой трон выдержал ${G.cleared} ${plural(G.cleared, ['волну', 'волны', 'волн'])} в «Защите трона», счёт ${fmt(G.score)}. Побьёшь? ${url}`.trim();
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); els.ovNote.hidden = false; els.ovNote.textContent = 'Результат скопирован. Вставьте его в чат друзьям.'; }
  catch (e) { window.prompt('Скопируйте результат и отправьте друзьям:', text); }
}

/* ================= Запуск ================= */
if (new URLSearchParams(location.search).has('debug')) {
  window.__throne = { G, TUNE, TOWERS, ENEMIES, WAVES, BLOCKED, PATH_LEN, STEP, posAt, isFree, newGame, build, upgrade, sell, startWave, step, waveDef };
}
new ResizeObserver(resize).observe(stage);
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { uiSig = ''; });
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
